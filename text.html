<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toko Ibu Desi – Dekomposisi & Komposisi Bilangan</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf3;--grid:#d9e6f2;--ink:#17324d;--mut:#51667a;--card:#fff;--line:#17324d;--ok:#2e9e6b;--no:#e4572e;--y:#f2a900;--b:#2f7fd1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101c2b;--grid:#1a2c40;--ink:#eaf1f8;--mut:#9fb3c6;--card:#172a3f;--line:#9fc4e8}}
:root[data-theme="dark"]{--bg:#101c2b;--grid:#1a2c40;--ink:#eaf1f8;--mut:#9fb3c6;--card:#172a3f;--line:#9fc4e8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:18px/1.5 Fredoka,"Trebuchet MS",system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dots{display:flex;gap:8px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--card)}.dots i.on{background:var(--y)}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:22px;box-shadow:5px 5px 0 var(--line)}
.center{text-align:center;max-width:620px;margin:6vh auto 0}
h1{font-size:clamp(1.6rem,4.5vw,2.6rem);margin:0 0 .4em;line-height:1.2}
p{margin:.3em 0 1em;color:var(--mut)}
input{font:700 1.5rem Fredoka,sans-serif;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%;max-width:360px;text-align:center}
button{font:700 1.1rem Fredoka,sans-serif;padding:10px 20px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--line);touch-action:manipulation}
button.go{background:var(--y);color:#17324d}
button.on,button.sel{background:var(--b);color:#fff}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.err{color:var(--no);font-weight:700;min-height:1.6em;margin-top:8px}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:14px 0}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px}
.item .em{font-size:2.6rem;line-height:1.1}
.seg{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.story{font-size:clamp(1.15rem,2.6vw,1.6rem);font-weight:500;margin:0 0 6px}
.baca{color:var(--b);font-size:clamp(1rem,2.2vw,1.35rem);min-height:1.5em;margin-bottom:10px}.baca b{color:var(--ink)}
.scroll{overflow-x:auto;padding-bottom:6px}
.tbl{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px;min-width:800px}
.hd{background:var(--grid);border:2px solid var(--line);border-radius:10px 10px 0 0;text-align:center;font-weight:700;padding:4px;font-size:1.05rem}
.cell{min-height:150px;border:3px dashed var(--line);border-radius:0 0 10px 10px;padding:6px;background:var(--bg)}
.cell.good{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--bg))}
.cell.bad{border-style:solid;border-color:var(--no);background:color-mix(in srgb,var(--no) 16%,var(--bg))}
.col{display:flex;flex-direction:column}
.ln{text-align:center;font-size:.95rem;color:var(--mut);margin-top:4px;min-height:1.4em}.ln b{color:var(--ink);font-size:1.1rem}
.ln.h{color:var(--no);font-weight:700}
.bill{border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.4);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;line-height:0;background:#fff}
.coin{border-radius:50%;box-shadow:0 0 0 2px #8a96a3;background:#fff;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;line-height:0}
.bill img,.coin img{width:100%;display:block;pointer-events:none;border-radius:inherit}
.stack{display:flex;flex-wrap:wrap;align-content:flex-start}.stack .bill{width:100%}.stack .bill+.bill{margin-top:-40px}
.stack .coin{width:58px;margin:3px}
.tray{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;background:var(--grid);border-radius:12px;padding:14px;margin-top:14px}
.tray .bill{width:150px}.tray .coin{width:64px}
.drag{position:fixed;z-index:99;pointer-events:none;cursor:grabbing;transform:scale(1.06) rotate(-3deg);margin:0!important}
.lbl{text-align:center;color:var(--mut);font-size:.95rem;margin-top:12px}
.msg{text-align:center;font-size:1.5rem;font-weight:700;min-height:1.6em;margin-top:12px}
.msg.ok{color:var(--ok)}.msg.no{color:var(--no)}
.hasil{text-align:center;font-size:clamp(1.1rem,2.6vw,1.6rem);font-weight:700;min-height:1.5em}
</style>
</head>
<body>
<main>
<div class="top"><div class="dots" id="dots"></div><button id="fs">Layar penuh</button></div>

<section id="s1" class="card center">
  <div style="font-size:3.5rem">👋</div>
  <h1>Halo! Siapa namamu?</h1>
  <input id="nama" maxlength="20" placeholder="Ketik namamu" autocomplete="off" aria-label="Nama">
  <div class="err" id="e1"></div>
  <div class="act"><button class="go" id="n1">Next ▶</button></div>
</section>

<section id="s2" class="card" hidden>
  <h1>Selamat datang di Toko Ibu Desi, <span id="hn"></span>! 🛍️</h1>
  <p>Pilih satu barang yang ingin dibeli.</p>
  <div class="items" id="items"></div>
  <div class="seg"><b>Jenis soal:</b><button id="mDek" class="on">Dekomposisi</button><button id="mKom">Komposisi</button></div>
  <div class="err" id="e2" style="text-align:center"></div>
  <div class="act"><button id="b2">◀ Kembali</button><button class="go" id="n2">Next ▶</button></div>
</section>

<section id="s3" class="card" hidden>
  <p class="story" id="story" style="color:var(--ink)"></p>
  <div class="baca" id="baca"></div>
  <div class="scroll"><div class="tbl" id="tbl"></div></div>
  <div class="lbl">Seret uang mainan ke tabel. Ketuk uang di tabel untuk mengambilnya kembali.</div>
  <div class="tray" id="tray"></div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="hasil" id="hasil"></div>
  <div class="act">
    <button id="b3">◀ Kembali</button>
    <button id="rst">Ulangi</button>
    <button class="go" id="chk">Cek jawaban</button>
    <button class="go" id="n3" hidden>Next ▶</button>
  </div>
</section>

<section id="s4" class="card center" hidden>
  <div style="font-size:3.5rem">🎉</div>
  <h1 id="h4"></h1>
  <p id="p4"></p>
  <div class="act"><button class="go" id="again">Belanja lagi</button></div>
</section>
</main>

const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString("id-ID");
const PLACE=["ratusan ribu","puluhan ribu","ribuan","ratusan","puluhan","satuan"];
const PV=[100000,10000,1000,100,10,1];
/* c = indeks kolom tempat uang itu */
const DEN=[{v:100000,c:0},{v:50000,c:1},{v:20000,c:1},{v:10000,c:1},{v:5000,c:2},{v:2000,c:2},{v:1000,c:2},{v:500,c:3},{v:200,c:3},{v:100,c:3},{v:50,c:3},{v:10,c:3},{v:5,c:3},{v:1,c:3}];
const ITEMS=[
 {n:"tas ransel",e:"🎒",h:285640},{n:"sepatu olahraga",e:"👟",h:567890},{n:"buku cerita",e:"📚",h:134205},
 {n:"kipas angin",e:"🌀",h:429078},{n:"jaket",e:"🧥",h:301456},{n:"sepeda lipat",e:"🚲",h:750382},
 {n:"rice cooker",e:"🍚",h:358701},{n:"headphone",e:"🎧",h:463920},{n:"jam tangan",e:"⌚",h:612083},
 {n:"mainan robot",e:"🤖",h:819360}];
const SAT=["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas"];
function baca(n){
  if(n===0)return"nol";
  const r=x=>x?" "+baca(x):"";
  if(n<12)return SAT[n];
  if(n<20)return SAT[n-10]+" belas";
  if(n<100)return SAT[Math.floor(n/10)]+" puluh"+r(n%10);
  if(n<200)return"seratus"+r(n-100);
  if(n<1000)return SAT[Math.floor(n/100)]+" ratus"+r(n%100);
  if(n<2000)return"seribu"+r(n-1000);
  if(n<1000000)return baca(Math.floor(n/1000))+" ribu"+r(n%1000);
  return"satu juta";
}

const zero=()=>PLACE.map(()=>DEN.map(()=>0));
let nama="",item=null,mode="dek",cnt=zero(),tg=[0,0,0,0];

/* slide */
for(let i=0;i<4;i++)$("dots").append(document.createElement("i"));
function go(n){
  [1,2,3,4].forEach(k=>$("s"+k).hidden=k!==n);
  [...$("dots").children].forEach((d,i)=>d.classList.toggle("on",i===n-1));
  window.scrollTo(0,0);
}

/* slide 1 */
function toS2(){
  const v=$("nama").value.trim();
  if(!v){$("e1").textContent="Ketik namamu dahulu ya.";return;}
  nama=v.charAt(0).toUpperCase()+v.slice(1);
  $("hn").textContent=nama;$("e1").textContent="";go(2);
}
$("n1").onclick=toS2;
$("nama").addEventListener("keydown",e=>{if(e.key==="Enter")toS2();});

/* slide 2 */
ITEMS.forEach(it=>{
  const b=document.createElement("button");b.className="item";b.setAttribute("aria-pressed","false");
  b.innerHTML=`<span class="em">${it.e}</span><b>${it.n.charAt(0).toUpperCase()+it.n.slice(1)}</b><span>Rp${fmt(it.h)}</span>`;
  b.onclick=()=>{item=it;$("e2").textContent="";[...$("items").children].forEach(c=>{const on=c===b;c.classList.toggle("sel",on);c.setAttribute("aria-pressed",on)});};
  $("items").append(b);
});
function setMode(m){mode=m;$("mDek").classList.toggle("on",m==="dek");$("mKom").classList.toggle("on",m==="kom");}
$("mDek").onclick=()=>setMode("dek");$("mKom").onclick=()=>setMode("kom");
$("b2").onclick=()=>go(1);
$("n2").onclick=()=>{if(!item){$("e2").textContent="Pilih satu barang dahulu.";return;}start();go(3);};

/* slide 3: uang mainan */
function mkMoney(d){
  const x=DEN[d],el=document.createElement("div");
  el.className=x.v<1000?"coin":"bill";el.dataset.d=d;
  el.innerHTML=`<img src="${IMG[x.v]}" alt="Uang Rp${fmt(x.v)}" draggable="false">`;
  return el;
}
PLACE.forEach((p,i)=>{
  const c=document.createElement("div");c.className="col";
  c.innerHTML=`<div class="hd">${p}</div><div class="cell" data-col="${i}"><div class="stack"></div></div><div class="ln">nilai: <b></b></div><div class="ln h"></div>`;
  $("tbl").append(c);
});
DEN.forEach((x,k)=>$("tray").append(mkMoney(k)));
const cells=()=>[...document.querySelectorAll(".cell")];
const colCount=c=>cnt[c].reduce((s,n)=>s+n,0);
const colVal=c=>DEN.reduce((s,x,k)=>s+cnt[c][k]*x.v,0);
function render(){
  document.querySelectorAll(".col").forEach((c,i)=>{
    const st=c.querySelector(".stack");st.innerHTML="";
    DEN.forEach((x,k)=>{for(let j=0;j<cnt[i][k];j++)st.append(mkMoney(k));});
    c.querySelector(".ln b").textContent=fmt(colVal(i));
  });
}
function clearMarks(){
  cells().forEach(c=>c.classList.remove("good","bad"));
  document.querySelectorAll(".ln.h").forEach(h=>h.textContent="");
  $("msg").textContent="";$("msg").className="msg";$("hasil").textContent="";$("n3").hidden=true;
  if(mode==="kom")$("baca").innerHTML="";
}
function start(){
  tg=PV.map(p=>Math.floor(item.h/p)%10);
  cnt=zero();
  const parts=tg.map((d,i)=>d*PV[i]).filter(v=>v>0);
  $("story").textContent=mode==="dek"
    ?`${nama} membeli ${item.n} di Toko Ibu Desi seharga Rp${fmt(item.h)}. Uraikan harga itu menurut nilai tempatnya dengan menyusun uang mainan di tabel!`
    :`${nama} membeli ${item.n} di Toko Ibu Desi. ${nama} membayar dengan uang ${parts.map(fmt).join(" + ")} rupiah. Susun uang itu di tabel nilai tempat, lalu cari harga ${item.n}!`;
  render();clearMarks();
  $("baca").innerHTML=mode==="dek"?`Dibaca: <b>${baca(item.h)} rupiah</b>`:"";
}
function warn(t){$("msg").textContent=t;$("msg").className="msg no";}

document.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".bill,.coin");
  if(!b||$("s3").hidden)return;
  e.preventDefault();
  const d=+b.dataset.d,placed=!!b.closest(".stack"),col=placed?+b.closest(".cell").dataset.col:-1;
  const r=b.getBoundingClientRect();
  const g=mkMoney(d);g.classList.add("drag");g.style.width=r.width+"px";document.body.append(g);
  if(placed){cnt[col][d]--;render();}
  const sx=e.clientX,sy=e.clientY;let moved=false;
  const pos=ev=>{g.style.left=(ev.clientX-r.width/2)+"px";g.style.top=(ev.clientY-r.height/2)+"px";};
  pos(e);
  const mv=ev=>{if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>6)moved=true;pos(ev);};
  const up=ev=>{
    document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
    const under=document.elementFromPoint(ev.clientX,ev.clientY);
    const cell=under&&under.closest(".cell");
    g.remove();clearMarks();
    if(!moved){render();return;}      // ketuk uang di tabel = ambil kembali
    let ok=false;
    if(cell){
      const ci=+cell.dataset.col;
      if(colCount(ci)>=20)warn("Maksimal 20 lembar dalam satu kolom.");
      else{cnt[ci][d]++;ok=true;}
      if(!ok&&placed)cnt[col][d]++;
    }
    render();
  };
  document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
});

$("chk").onclick=()=>{
  let ok=0;
  const hs=document.querySelectorAll(".ln.h");
  cells().forEach((c,i)=>{
    const t=tg[i]*PV[i],v=colVal(i),g=v===t;
    c.classList.remove("good","bad");c.classList.add(g?"good":"bad");
    hs[i].textContent=g?"":(v<t?"masih kurang":"terlalu banyak");
    if(g)ok++;
  });
  const m=$("msg");
  if(ok<6){m.className="msg no";m.textContent=`Baru ${ok} dari 6 kolom yang tepat. Perhatikan kolom yang merah.`;return;}
  m.className="msg ok";m.textContent="Benar semua! Hebat! 🎉";
  const parts=tg.map((d,i)=>d*PV[i]).filter(v=>v>0);
  $("hasil").textContent=mode==="dek"
    ?`${fmt(item.h)} = ${parts.map(fmt).join(" + ")}`
    :`${parts.map(fmt).join(" + ")} = ${fmt(item.h)}. Harga ${item.n} Rp${fmt(item.h)}`;
  $("baca").innerHTML=`Dibaca: <b>${baca(item.h)} rupiah</b>`;
  $("n3").hidden=false;
};
$("rst").onclick=()=>{cnt=zero();render();clearMarks();};
$("b3").onclick=()=>go(2);
$("n3").onclick=()=>{
  $("h4").textContent=`Hebat, ${nama}!`;
  $("p4").textContent=`Kamu berhasil menyelesaikan soal ${mode==="dek"?"dekomposisi":"komposisi"} untuk ${item.n} seharga Rp${fmt(item.h)}.`;
  go(4);
};

/* slide 4 */
$("again").onclick=()=>{item=null;[...$("items").children].forEach(c=>{c.classList.remove("sel");c.setAttribute("aria-pressed","false")});go(2);};
$("fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){}};
go(1);
</script>
</body>
</html>
